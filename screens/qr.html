<div class="panel wide center">
  <h2>QR payment</h2>
  <p class="big-amount">Amount to pay: <strong id="qr-total"></strong></p>
  <div class="qr" aria-label="QR code placeholder"><span>QR CODE<br>(simulated)</span></div>
  <ol class="instructions">
    <li>Open your e-wallet or banking app.</li>
    <li>Scan the QR code above.</li>
    <li>Check the amount, pay, then tap Confirm Payment.</li>
  </ol>
  <div class="actions">
    <button id="qr-back" class="btn secondary">Back</button>
    <button id="qr-pay" class="btn primary">Confirm Payment</button>
  </div>
</div>
