<div class="panel wide">
  <h2>How would you like to pay?</h2>
  <p class="muted">Amount due: <strong id="method-total"></strong></p>
  <div class="methods">
    <button class="method" data-method="cash"><img src="assets/images/payments/cash.png" alt="Philippine peso cash" width="1254" height="1254">Cash</button>
    <button class="method" data-method="qr"><img src="assets/images/payments/qr-payment.png" alt="Smartphone scanning a payment QR code" width="1254" height="1254">QR Payment</button>
    <button class="method" data-method="card"><img src="assets/images/payments/card-payment.png" alt="Bank card and payment terminal" width="1254" height="1254">Credit/Debit Card</button>
  </div>
  <div class="actions"><button id="method-back" class="btn secondary">Back</button></div>
</div>
