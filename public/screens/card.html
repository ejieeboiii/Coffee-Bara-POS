<div class="panel wide center">
  <h2>Card payment</h2>
  <p class="big-amount">Amount due: <strong id="card-total"></strong></p>

  <div class="actions">
    <button id="card-back" class="btn secondary">Back</button>
    <button id="card-pay" class="btn primary">Process Payment</button>
  </div>
</div>
