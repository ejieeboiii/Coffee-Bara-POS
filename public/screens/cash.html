<div class="panel wide">
  <h2>Cash payment</h2>
  <p class="big-amount">Total: <strong id="cash-total"></strong></p>
  <label for="cash-input">Amount paid (₱)</label>
  <input id="cash-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
  <p class="change-line">Change: <strong id="cash-change">₱0.00</strong></p>
  <p id="cash-error" class="error" role="alert"></p>
  <div class="actions">
    <button id="cash-back" class="btn secondary">Back</button>
    <button id="cash-pay" class="btn primary" disabled>Pay Now</button>
  </div>
</div>
