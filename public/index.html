<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Bara POS</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/welcome.css">
  <link rel="stylesheet" href="css/select.css">
  <link rel="stylesheet" href="css/summary.css">
  <link rel="stylesheet" href="css/method.css">
  <link rel="stylesheet" href="css/cash.css">
  <link rel="stylesheet" href="css/qr.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/success.css">
  <link rel="stylesheet" href="css/receipt.css">
</head>
<body class="welcome-mode">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="assets/images/coffee-bara-logo.png" alt="Coffee Bara logo" width="1254" height="1254">
    </div>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <span class="nav-item active" aria-current="page"><span aria-hidden="true">▦</span> Menu</span>
    </nav>
    <section class="sidebar-promo" aria-labelledby="sidebar-promo-title">
      <img src="assets/images/coffee-bara-mascot.png" alt="Standing Coffee Bara capybara holding a takeaway coffee cup" width="1024" height="1536">
      <h2 id="sidebar-promo-title">Good Coffee,<br>Brighter Days</h2>
    </section>
    <div class="sidebar-footer"><span class="status-dot"></span> Coffee Bara Kiosk</div>
  </aside>
  <header class="topbar"><div class="header-brand"><img class="header-logo" src="assets/images/coffee-bara-icon.png" alt="Coffee Bara capybara logo" width="1254" height="1254"><h1>Coffee Bara</h1></div><span id="step-label"></span></header>
  <main id="app"><!-- screens from /screens are loaded here --></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
